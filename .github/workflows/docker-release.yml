name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published GitHub release tag
        type: string
        default: v1.0.0
        required: true
      publish:
        description: Push the tested image to Docker Hub
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
  DOCKERHUB_IMAGE: dotnetorgcn/simdkafka

jobs:
  verify:
    name: Build and test ${{ matrix.arch }}
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Download and verify the published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag such as v1.0.0" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease | jq -e '(.isDraft or .isPrerelease) == false' >/dev/null
          version="${RELEASE_TAG#v}"
          bundle="SimdKafka-$version-portable.tar.gz"
          destination="$RUNNER_TEMP/simdkafka-release"
          mkdir -p "$destination"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$bundle" --pattern SHA256SUMS.txt --dir "$destination"
          checksum=$(awk -v name="$bundle" '$2 == name {print $1}' "$destination/SHA256SUMS.txt")
          if [[ ! $checksum =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo "No unique SHA-256 for $bundle" >&2
            exit 1
          fi
          (cd "$destination" && printf '%s  %s\n' "$checksum" "$bundle" | sha256sum -c -)
          mv "$destination/$bundle" "$destination/simdkafka.tar.gz"
          revision=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          [[ $revision =~ ^[a-f0-9]{40}$ ]]
          printf 'version=%s\nchecksum=%s\nrevision=%s\n' "$version" "$checksum" "$revision" >> "$GITHUB_OUTPUT"
      - name: Build image
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CHECKSUM: ${{ steps.release.outputs.checksum }}
          REVISION: ${{ steps.release.outputs.revision }}
        run: |
          docker buildx build --platform "linux/$ARCH" --load --provenance=false \
            --build-context "release-bundle=$RUNNER_TEMP/simdkafka-release" \
            --build-arg "SIMDKAFKA_VERSION=$VERSION" \
            --build-arg "SIMDKAFKA_RELEASE_SHA256=$CHECKSUM" \
            --build-arg "SIMDKAFKA_REVISION=$REVISION" \
            --tag "simdkafka-ci:$ARCH" .
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "simdkafka-ci:$ARCH")" = "linux/$ARCH"
      - name: Verify Kafka produce, fetch, and restart recovery
        run: bash docker/smoke.sh "simdkafka-ci:$ARCH"
      - name: Save the tested image
        if: github.event_name == 'release' || inputs.publish
        run: docker image save -o "$RUNNER_TEMP/$ARCH.tar" "simdkafka-ci:$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'release' || inputs.publish
        with:
          name: simdkafka-docker-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.arch }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    name: Publish multi-architecture tags
    needs: verify
    if: github.event_name == 'release' || (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: docker-hub-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: simdkafka-docker-*
          path: ${{ runner.temp }}/simdkafka-images
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: dotnetorgcn
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the tested images
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash docker/publish.sh "$DOCKERHUB_IMAGE" "$RELEASE_TAG" "$RUNNER_TEMP/simdkafka-images"
